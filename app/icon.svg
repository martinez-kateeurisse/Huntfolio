<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Huntfolio browser-tab icon. Same shapes as components/logo.tsx;
       switches colours with the system light/dark setting. -->
  <style>
    .mark { fill: #1e293b; }
    .dot { fill: #6366f1; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #e2e8f0; }
      .dot { fill: #818cf8; }
    }
  </style>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <line x1="2" y1="23.53" x2="30" y2="17.47" stroke="#000" stroke-width="1.5"/>
      <circle cx="25" cy="15.85" r="3.7" fill="#000"/>
    </mask>
  </defs>
  <g class="mark" mask="url(#cut)">
    <rect x="4" y="11" width="6" height="17" rx="1.4"/>
    <rect x="13" y="7.5" width="6" height="20.5" rx="1.4"/>
    <rect x="22" y="4" width="6" height="24" rx="1.4"/>
    <polygon points="4,18.6 28,13.4 28,17 4,22.2"/>
  </g>
  <circle class="dot" cx="25" cy="15.85" r="2.5"/>
</svg>
